name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 ${{ forge.server_url }}/${{ forge.repository }} .
          git checkout ${{ forge.sha }}
      
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/broadside:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/broadside:latest
